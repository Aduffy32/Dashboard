<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared.css">
<link rel="manifest" href="manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PO Coach" />
<meta name="theme-color" content="#050506" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
</head>
<body class="grain-overlay">
<!-- Auth overlay -->
<div class="auth-overlay hidden" id="authOverlay">
  <div class="auth-card">
    <div class="auth-title">My Dashboard</div>
    <p class="auth-sub">Sign in to sync your goals across all your devices.</p>
    <button class="auth-sign-in-btn" id="signInBtn">
      <!-- Google G logo -->
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<!-- App -->
<div id="appContainer"><div class="tab-page active" id="page-finance">
<div class="container">
  <div class="section">

    <!-- Month summary chips -->
    <div class="fin-summary-row">
      <div class="fin-stat-chip">
        <span class="fin-stat-label">Income</span>
        <span class="fin-stat-value income" id="finIncome">$0.00</span>
      </div>
      <div class="fin-stat-chip">
        <span class="fin-stat-label">Expenses</span>
        <span class="fin-stat-value expense" id="finExpenses">$0.00</span>
      </div>
      <div class="fin-stat-chip">
        <span class="fin-stat-label">Net Balance</span>
        <span class="fin-stat-value" id="finNet">$0.00</span>
      </div>
    </div>

    <div class="gm-card fin-networth-card" style="margin-bottom:16px;">
      <div class="gm-eyebrow" style="margin-bottom:14px;">Net Worth</div>
      <div class="fin-nw-total-row">
        <span class="fin-nw-total" id="finNwTotal">€0</span>
        <button class="fin-nw-edit-btn" id="finNwEditBtn">Edit accounts</button>
      </div>
      <div class="fin-nw-accounts" id="finNwAccounts"></div>
    </div>

    <div class="nutr-panel" id="finAccountsPanel" style="position:fixed;inset:0;z-index:200;background:var(--bg, #050506);overflow-y:auto;transform:translateX(100%);transition:transform 0.28s cubic-bezier(0.32,0.72,0,1);">
      <div class="nutr-panel-hdr" style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.07);">
        <button class="nutr-panel-back" id="finAccountsBack">←</button>
        <span class="nutr-panel-title">ACCOUNTS</span>
      </div>
      <div style="padding:16px;" id="finAccountsList"></div>
      <div style="padding:0 16px 16px;">
        <div class="gm-eyebrow" style="margin-bottom:10px;">Add Account</div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <input type="text" id="finAccName" class="fin-input" placeholder="Account name (e.g. Revolut, Pension)">
          <div style="display:flex;gap:8px;">
            <select id="finAccType" class="fin-input" style="flex:1;">
              <option value="current">Current</option>
              <option value="savings">Savings</option>
              <option value="investment">Investment</option>
            </select>
            <input type="number" id="finAccBalance" class="fin-input" placeholder="Balance" style="flex:1;" step="0.01">
            <button id="finAccAddBtn" class="goal-add-btn">+ Add</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Daily spending chart -->
    <div class="gm-card fin-chart-wrap">
      <div class="gm-eyebrow" id="finChartTitle">Daily Spending</div>
      <svg id="finChartSvg" class="fin-chart-svg" viewBox="0 0 600 90" preserveAspectRatio="none" height="90" style="margin-top:12px;"></svg>
    </div>

    <!-- Budgets -->
    <div class="section-title" id="finBudgetTitle">Budgets</div>
    <div id="finBudgetList"></div>
    <div class="gm-card">
      <div class="gm-eyebrow">Set Budget</div>
      <div class="fin-form-row" style="margin-top:14px;">
        <select id="finBudgetCategory" class="fin-input" style="flex:0 1 180px;">
          <option value="Food">🍔 Food</option>
          <option value="Transport">🚗 Transport</option>
          <option value="Housing">🏠 Housing</option>
          <option value="Health">💊 Health</option>
          <option value="Entertainment">🎬 Entertainment</option>
          <option value="Shopping">🛍️ Shopping</option>
          <option value="Other">📦 Other</option>
        </select>
        <input type="number" id="finBudgetLimit" class="fin-input" placeholder="Monthly limit" min="0" step="0.01" style="max-width:160px;flex:0 1 160px;"/>
        <button id="finBudgetAddBtn" class="goal-add-btn">+ Set</button>
      </div>
      <div id="finBudgetStatus" class="polish-status"></div>
    </div>

    <!-- Transactions -->
    <div class="section-title" id="finSectionTitle">Transactions</div>

    <div class="gm-card">
      <div class="gm-eyebrow">Add Transaction</div>
      <div style="margin-top:14px;">
        <div class="fin-form-row">
          <div class="fin-type-toggle">
            <button class="fin-type-btn" id="finTypeBtnIncome"  data-type="income">Income</button>
            <button class="fin-type-btn" id="finTypeBtnExpense" data-type="expense">Expense</button>
          </div>
          <input type="number" id="finAmount" class="fin-input" placeholder="Amount" min="0" step="0.01" style="max-width:140px;flex:0 1 140px;"/>
          <input type="date"   id="finDate"   class="fin-input" style="max-width:160px;flex:0 1 160px;"/>
        </div>
        <div class="fin-form-row">
          <select id="finCategory" class="fin-input" style="flex:0 1 180px;">
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Housing">🏠 Housing</option>
            <option value="Health">💊 Health</option>
            <option value="Entertainment">🎬 Entertainment</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Other">📦 Other</option>
          </select>
          <input type="text" id="finNote" class="fin-input" placeholder="Note (optional)"/>
          <button id="finAddBtn" class="goal-add-btn">+ Add</button>
        </div>
      </div>
    </div>

    <div id="finList"></div>
  </div>
</div>
</div>

<nav class="bottom-nav" aria-label="Main navigation">
  <button class="nav-tab" data-tab="home" aria-label="Home">
    <div class="nav-tab-indicator"></div>
    <div class="nav-tab-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3l9 9"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>
    </div>
    <span class="nav-tab-label">Home</span>
  </button>
  <button class="nav-tab" data-tab="tasks" aria-label="Tasks">
    <div class="nav-tab-indicator"></div>
    <div class="nav-tab-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,11 12,14 22,4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    </div>
    <span class="nav-tab-label">Tasks</span>
  </button>
  <button class="nav-tab" data-tab="goals" aria-label="Goals">
    <div class="nav-tab-indicator"></div>
    <div class="nav-tab-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>
    </div>
    <span class="nav-tab-label">Goals</span>
  </button>
  <button class="nav-tab" data-tab="gym" aria-label="Gym">
    <div class="nav-tab-indicator"></div>
    <div class="nav-tab-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="2" height="6" rx="0.5"/><rect x="4.5" y="7.5" width="3" height="9" rx="0.5"/><line x1="7.5" y1="12" x2="16.5" y2="12"/><rect x="16.5" y="7.5" width="3" height="9" rx="0.5"/><rect x="20" y="9" width="2" height="6" rx="0.5"/></svg>
    </div>
    <span class="nav-tab-label">Gym</span>
  </button>
  <button class="nav-tab" data-tab="health" aria-label="Health">
    <div class="nav-tab-indicator"></div>
    <div class="nav-tab-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
    </div>
    <span class="nav-tab-label">Health</span>
  </button>
  <button class="nav-tab" data-tab="nutrition" aria-label="Nutrition">
    <div class="nav-tab-indicator"></div>
    <div class="nav-tab-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v6c0 1.1.9 2 2 2a2 2 0 002-2V3"/><line x1="5" y1="9" x2="5" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><path d="M15 3a4 4 0 014 4v1h-4"/></svg>
    </div>
    <span class="nav-tab-label">Nutrition</span>
  </button>
  <button class="nav-tab active" data-tab="finance" aria-label="Finance">
    <div class="nav-tab-indicator"></div>
    <div class="nav-tab-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="14" width="4" height="7"/><rect x="9" y="8" width="4" height="13"/><rect x="16" y="4" width="4" height="17"/><line x1="1" y1="21" x2="23" y2="21"/></svg>
    </div>
    <span class="nav-tab-label">Finance</span>
  </button>
</nav>
</div>
<script src="shared.js"></script>
<script>
function finAccLoad() { try { return JSON.parse(localStorage.getItem('po_finance_accounts') || '[]'); } catch { return []; } }
function finAccSave(arr) { localStorage.setItem('po_finance_accounts', JSON.stringify(arr)); }

function finNwRender() {
  const accounts = finAccLoad();
  const total = accounts.reduce((s, a) => s + (parseFloat(a.balance) || 0), 0);
  const fmt = v => (v < 0 ? '-' : '') + '€' + Math.abs(v).toLocaleString('en-IE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  const el = document.getElementById('finNwTotal');
  if (el) { el.textContent = fmt(total); el.style.color = total < 0 ? '#FF6B6B' : 'var(--text-primary)'; }
  const list = document.getElementById('finNwAccounts');
  if (!list) return;
  if (!accounts.length) { list.innerHTML = '<div style="font-size:12px;color:var(--text-tertiary);font-style:italic;padding:4px 0;">No accounts yet — tap Edit accounts to add.</div>'; return; }
  list.innerHTML = accounts.map(a => `<div class="fin-nw-account"><div><div class="fin-nw-acc-name">${a.name}</div><div class="fin-nw-acc-type">${a.type}</div></div><div class="fin-nw-acc-balance">${fmt(parseFloat(a.balance)||0)}</div></div>`).join('');
}

function finAccPanelRender() {
  const list = document.getElementById('finAccountsList');
  if (!list) return;
  const accounts = finAccLoad();
  if (!accounts.length) { list.innerHTML = '<div style="font-size:12px;color:var(--text-tertiary);padding:8px 0;">No accounts yet.</div>'; return; }
  list.innerHTML = accounts.map(a => `<div class="fin-acc-edit-row"><div class="fin-acc-edit-info"><div class="fin-nw-acc-name">${a.name}</div><div class="fin-nw-acc-type">${a.type}</div></div><input class="fin-acc-bal-in" type="number" data-id="${a.id}" value="${a.balance}" step="0.01"><button class="fin-acc-del-btn" data-del="${a.id}">✕</button></div>`).join('');
  list.querySelectorAll('.fin-acc-bal-in').forEach(inp => {
    inp.addEventListener('change', () => {
      const all = finAccLoad(); const idx = all.findIndex(x => x.id === inp.dataset.id);
      if (idx >= 0) { all[idx].balance = parseFloat(inp.value) || 0; finAccSave(all); finNwRender(); }
    });
  });
  list.querySelectorAll('.fin-acc-del-btn').forEach(btn => {
    btn.addEventListener('click', () => { finAccSave(finAccLoad().filter(x => x.id !== btn.dataset.del)); finAccPanelRender(); finNwRender(); });
  });
}

function finAccInit() {
  document.getElementById('finNwEditBtn')?.addEventListener('click', () => {
    finAccPanelRender();
    const p = document.getElementById('finAccountsPanel');
    if (p) p.style.transform = 'translateX(0)';
  });
  document.getElementById('finAccountsBack')?.addEventListener('click', () => {
    const p = document.getElementById('finAccountsPanel');
    if (p) p.style.transform = 'translateX(100%)';
  });
  document.getElementById('finAccAddBtn')?.addEventListener('click', () => {
    const name = document.getElementById('finAccName').value.trim();
    const type = document.getElementById('finAccType').value;
    const bal  = parseFloat(document.getElementById('finAccBalance').value) || 0;
    if (!name) return;
    const all = finAccLoad();
    all.push({ id: 'acc_' + Date.now(), name, type, balance: bal });
    finAccSave(all);
    document.getElementById('finAccName').value = '';
    document.getElementById('finAccBalance').value = '';
    finAccPanelRender();
    finNwRender();
  });
  finNwRender();
}

finAccInit();
</script>
</body>
</html>
