<style>
@keyframes cardSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.daily-reminders { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.daily-reminders-label { font-family: ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-tertiary); margin-right: 4px; flex-shrink: 0; }
.reminder-chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(242,192,99,0.30); background: rgba(242,192,99,0.08); color: var(--text-primary); font-size: 12px; font-weight: 600; text-decoration: none; transition: border-color 0.2s, background 0.2s; cursor: pointer; }
.reminder-chip:hover { border-color: rgba(242,192,99,0.55); background: rgba(242,192,99,0.14); }
.reminder-chip-dot { width: 6px; height: 6px; border-radius: 50%; background: #F2C063; box-shadow: 0 0 7px rgba(242,192,99,0.7); flex-shrink: 0; }
.reminder-chip-arrow { color: var(--text-tertiary); font-size: 11px; }
</style>
</head>
<body class="grain-overlay">
<!-- Auth overlay -->
<div class="auth-overlay hidden" id="authOverlay">
  <div class="auth-card">
    <div class="auth-title">My Dashboard</div>
    <p class="auth-sub">Sign in to sync your goals across all your devices.</p>
    <button class="auth-sign-in-btn" id="signInBtn">
      <!-- Google G logo -->
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<!-- App -->
<div id="appContainer"><div class="tab-page active" id="page-home">
<div class="container">

  <div class="dash-header">
    <h1 class="dash-title">My Dashboard</h1>
    <div class="user-bar">
      <span class="user-email" id="userEmailEl"></span>
      <span class="sync-dot" id="syncDot" title="Sync status"></span>
      <button class="sign-out-btn" id="signOutBtn">Sign out</button>
    </div>
  </div>

  <div class="ticker-row">
    <div class="goal-ticker" id="goalTicker" aria-live="polite" aria-atomic="true">
      <div class="goal-ticker-led"><span class="goal-ticker-led-dot"></span></div>
      <div class="goal-ticker-label">GOALS</div>
      <div class="goal-ticker-stage" id="goalTickerStage">
        <div class="goal-ticker-row">
          <span class="goal-ticker-status" data-status="">·</span>
          <span class="goal-ticker-text">Loading…</span>
        </div>
      </div>
      <div class="goal-ticker-meta" id="goalTickerMeta">0/0</div>
    </div>
  </div>

  <div class="day-ring-card">
    <div class="day-ring-container">
      <div class="day-ring-wrap">
        <svg class="day-ring-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="ring-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
          <circle id="dayRingFill" cx="60" cy="60" r="52" fill="none" stroke-width="8"
            stroke-linecap="round" transform="rotate(-90 60 60)" filter="url(#ring-glow)"/>
        </svg>
        <div class="day-ring-overlay">
          <span id="dayRingPercent" class="day-ring-percent">—</span>
          <span id="dayRingPhase" class="day-ring-phase">SLEEPING</span>
          <span id="dayRingClock" class="day-ring-clock"></span>
        </div>
      </div>
      <div class="day-ring-info">
        <div id="dayRingStatus" class="day-ring-status"></div>
        <div id="dayRingRemaining" class="day-ring-remaining"></div>
        <div class="day-ring-range">8:00 AM – 12:00 AM</div>
      </div>
    </div>
  </div>

  <div id="dailyReminders"></div>

  <!-- Water summary widget -->
  <div class="gm-card hlth-water-widget" id="waterWidget" style="animation: cardSlideIn 0.45s cubic-bezier(0.16,1,0.3,1) both; animation-delay: 0.04s;"></div>

  <!-- Whoop overview widget -->
  <div class="gm-card" id="whoopWidget" style="padding:18px 20px;margin-bottom:16px; animation: cardSlideIn 0.45s cubic-bezier(0.16,1,0.3,1) both; animation-delay: 0.08s;"></div>


</div>
</div>

</div>

<script src="shared.js"></script>
<script>
function renderDailyReminders() {
  const el = document.getElementById('dailyReminders');
  if (!el) return;

  const now = new Date();
  const dateKey = now.getHours() < 6
    ? new Date(now - 864e5).toISOString().slice(0, 10)
    : now.toISOString().slice(0, 10);

  const weights = JSON.parse(localStorage.getItem('po_coach_weights') || '[]');
  const weightLogged = weights.some(e => e.dateKey === dateKey);

  const workoutDone = JSON.parse(localStorage.getItem('po_coach_workout_done') || '{}');
  const gymLogged = !!workoutDone[dateKey];

  const reminders = [];
  if (!weightLogged) reminders.push({ icon: '⚖️', text: "Log today's weight", href: 'gym.html' });
  if (!gymLogged)    reminders.push({ icon: '🏋️', text: "Log today's workout", href: 'gym.html' });

  if (!reminders.length) { el.innerHTML = ''; return; }

  el.innerHTML = `<div class="daily-reminders">
  <span class="daily-reminders-label">TODAY</span>
  ${reminders.map(r => `<a class="reminder-chip" href="${r.href}"><span class="reminder-chip-dot"></span>${r.icon} ${r.text}<span class="reminder-chip-arrow">›</span></a>`).join('')}
</div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  renderDailyReminders();

  const _origWater = window.waterWidgetRender;
  if (typeof _origWater === 'function') {
    window.waterWidgetRender = function() {
      _origWater.apply(this, arguments);
      renderDailyReminders();
    };
  }

  const _origWhoop = window.renderWhoopHomeWidget;
  if (typeof _origWhoop === 'function') {
    window.renderWhoopHomeWidget = function() {
      _origWhoop.apply(this, arguments);
      renderDailyReminders();
    };
  }
});
</script>
</body>
</html>
